name: CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

# Tool versions follow docs/tool-versions.md: scripts/tool-requirements.txt
# lists the PyPI tools, and every job checks them with tool_versions.py
# --strict. Runner labels are pinned, so that a new runner image does not
# change compilers or preinstalled tools unnoticed.
#
# Linux jobs run in the debian:13-slim image. scripts/install_linux_tools.sh
# installs the same tools on any Debian or Ubuntu image, so the setup can be
# reproduced locally with Docker. The image has no git; each Linux job installs
# it before the checkout, so that the checkout is a git work tree.

jobs:
  contracts:
    name: Contract tests (debian-13)
    runs-on: ubuntu-24.04
    container: debian:13-slim

    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sh scripts/install_linux_tools.sh "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - name: Verify tool versions
        run: python scripts/tool_versions.py --strict

      - name: Run contract tests
        run: |
          for test in scripts/*_test.py; do
            python3 "$test"
          done

  quality-linux:
    name: Quality (debian-13, shared=${{ matrix.shared }})
    runs-on: ubuntu-24.04
    container: debian:13-slim
    strategy:
      fail-fast: false
      matrix:
        shared:
          - OFF
          - ON

    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sh scripts/install_linux_tools.sh "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - name: Verify tool versions
        run: python scripts/tool_versions.py --strict

      - name: Run quality gate
        env:
          CPP_DEV_CMAKE_CONFIGURE_ARGS: -G Ninja -DBUILD_SHARED_LIBS=${{ matrix.shared }}
        run: python3 scripts/quality.py check

  quality:
    name: Quality (${{ matrix.os }}, shared=${{ matrix.shared }}${{ matrix.compiler != 'default' && format(', {0}', matrix.compiler) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - windows-2025
        shared:
          - OFF
          - ON
        # The runner's default compiler: AppleClang on macOS, cl on Windows.
        compiler:
          - default
        include:
          - os: windows-2025
            shared: OFF
            compiler: clang-cl
          - os: windows-2025
            shared: ON
            compiler: clang-cl

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # runner context is available in step properties, but not in job-level
      # env; the image version is a runner environment variable, so read it in
      # a step and pass it to the cache key through GITHUB_OUTPUT.
      - name: Read Windows image version
        if: runner.os == 'Windows'
        id: image-version
        shell: pwsh
        run: |
          if (-not $env:ImageVersion) { throw "ImageVersion is not set" }
          "version=$env:ImageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pip-cache
          key: pip-${{ runner.os }}-${{ hashFiles('scripts/tool-requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Cache vcpkg binaries
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ steps.image-version.outputs.version }}
          restore-keys: vcpkg-${{ runner.os }}-

      # The runner image comes with another LLVM release. clang-cl uses the
      # recommended LLVM release, like clang-format and clang-tidy. On a cache
      # miss the installation is copied into the cached directory, so that
      # both cases put the same files on PATH.
      - name: Cache LLVM for clang-cl
        if: matrix.compiler == 'clang-cl'
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llvm-21.1.8
          key: llvm-21.1.8-${{ runner.os }}-clang-cl-v1

      - name: Install LLVM for clang-cl
        if: matrix.compiler == 'clang-cl' && steps.llvm-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          choco upgrade llvm --version=21.1.8 --allow-downgrade -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $source = "C:\Program Files\LLVM"
          $cache = Join-Path $env:RUNNER_TEMP "llvm-21.1.8"
          $bin = Join-Path $cache "bin"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          foreach ($name in "clang-cl.exe", "lld-link.exe", "llvm-lib.exe") {
            $path = Join-Path $source "bin\$name"
            if (-not (Test-Path $path)) { throw "The LLVM installation is missing bin\$name" }
            Copy-Item $path $bin
          }
          foreach ($name in "llvm-ar.exe", "llvm-mt.exe", "llvm-rc.exe", "llvm-ml.exe") {
            $path = Join-Path $source "bin\$name"
            if (Test-Path $path) { Copy-Item $path $bin }
          }
          Get-ChildItem (Join-Path $source "bin") -Filter *.dll | Copy-Item -Destination $bin
          New-Item -ItemType Directory -Force -Path (Join-Path $cache "lib") | Out-Null
          Copy-Item (Join-Path $source "lib\clang") (Join-Path $cache "lib") -Recurse -Force

      - name: Use LLVM for clang-cl
        if: matrix.compiler == 'clang-cl'
        shell: pwsh
        run: |
          "$env:RUNNER_TEMP\llvm-21.1.8\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install macOS tools
        if: runner.os == 'macOS'
        env:
          PIP_CACHE_DIR: ${{ runner.temp }}/pip-cache
        run: |
          brew install googletest
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/python" -m pip install --disable-pip-version-check --quiet -r scripts/tool-requirements.txt
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Install Python tools
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PIP_CACHE_DIR: ${{ runner.temp }}/pip-cache
        run: |
          python -m venv "$env:RUNNER_TEMP\tools"
          & "$env:RUNNER_TEMP\tools\Scripts\python.exe" -m pip install --disable-pip-version-check --quiet -r scripts/tool-requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:RUNNER_TEMP\tools\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install GoogleTest
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}/vcpkg-cache,readwrite
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\vcpkg-cache" | Out-Null
          vcpkg install gtest:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify tool versions
        run: python scripts/tool_versions.py --strict ${{ matrix.compiler == 'clang-cl' && '--tool clang-cl' || '' }}

      - name: Run quality gate
        if: runner.os != 'Windows'
        env:
          CPP_DEV_CMAKE_CONFIGURE_ARGS: -G Ninja -DBUILD_SHARED_LIBS=${{ matrix.shared }}
        run: python3 scripts/quality.py check

      - name: Run quality gate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = if ("${{ matrix.compiler }}" -eq "clang-cl") { "clang-cl" } else { "cl" }
          $env:CC = $compiler
          $env:CXX = $compiler
          $env:CPP_DEV_CMAKE_CONFIGURE_ARGS = "-G Ninja -DBUILD_SHARED_LIBS=${{ matrix.shared }} -DCMAKE_C_COMPILER=$compiler -DCMAKE_CXX_COMPILER=$compiler -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows"
          python scripts/quality.py check

      # The runner image ships another LLVM, and Visual Studio has its own
      # tools. Fail if a tool from a directory that also contains clang-cl.exe
      # differs from the directory of CMAKE_CXX_COMPILER: that would mix two
      # LLVM installations.
      - name: Check for mixed LLVM installations
        if: matrix.compiler == 'clang-cl'
        shell: pwsh
        run: |
          $cacheFile = "build/quality/CMakeCache.txt"
          if (-not (Test-Path $cacheFile)) { throw "Missing $cacheFile" }
          $values = @{}
          foreach ($line in Get-Content $cacheFile) {
            if ($line -match '^([A-Za-z0-9_]+):[A-Za-z]+=(.*)$') {
              $values[$matches[1]] = $matches[2]
            }
          }
          $names = "CMAKE_CXX_COMPILER", "CMAKE_LINKER", "CMAKE_AR", "CMAKE_MT", "CMAKE_RC_COMPILER"
          foreach ($name in $names) { Write-Host "$name=$($values[$name])" }
          $compiler = $values["CMAKE_CXX_COMPILER"]
          if (-not $compiler -or $compiler -eq "NOTFOUND") {
            throw "CMAKE_CXX_COMPILER is not set in $cacheFile"
          }
          function Get-ToolDirectory([string] $path) {
            return (Split-Path -Parent $path).Replace("\", "/").ToLowerInvariant()
          }
          $compilerDirectory = Get-ToolDirectory $compiler
          foreach ($name in $names) {
            $tool = $values[$name]
            if (-not $tool -or $tool -eq "NOTFOUND" -or $tool -like "*-NOTFOUND") { continue }
            $directory = Get-ToolDirectory $tool
            if ((Test-Path (Join-Path $directory "clang-cl.exe")) -and
                $directory -ne $compilerDirectory) {
              throw "Two LLVMs are mixed: $name is $tool, but CMAKE_CXX_COMPILER is $compiler"
            }
          }

  sanitizers:
    name: Sanitizers (debian-13)
    runs-on: ubuntu-24.04
    container: debian:13-slim

    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sh scripts/install_linux_tools.sh "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - name: Verify tool versions
        run: python scripts/tool_versions.py --strict

      - name: Configure
        run: cmake --preset asan-ubsan -G Ninja

      - name: Build
        run: cmake --build --preset asan-ubsan

      - name: Test
        run: ctest --preset asan-ubsan

  thread-sanitizer:
    name: ThreadSanitizer (debian-13)
    runs-on: ubuntu-24.04
    container:
      image: debian:13-slim
      # Docker's default seccomp profile does not let setarch disable address
      # space randomization.
      options: --security-opt seccomp=unconfined

    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sh scripts/install_linux_tools.sh "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - name: Verify tool versions
        run: python scripts/tool_versions.py --strict

      - name: Configure
        run: cmake --preset tsan -G Ninja

      # ThreadSanitizer aborts when the kernel's mmap randomization breaks its
      # memory layout, as on the runner. setarch -R turns randomization off for
      # the build, which runs the test executable to list its tests, and for
      # the tests.
      - name: Build
        run: setarch "$(uname -m)" -R cmake --build --preset tsan

      - name: Test
        run: setarch "$(uname -m)" -R ctest --preset tsan

  docs:
    name: Docs (debian-13)
    runs-on: ubuntu-24.04
    container: debian:13-slim

    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git

      - name: Checkout
        uses: actions/checkout@v4

      # Debian 13 provides Doxygen 1.9.8, which does not report undocumented
      # namespaces; --doxygen installs the recommended release instead.
      - name: Install tools
        run: |
          sh scripts/install_linux_tools.sh --doxygen "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - name: Verify tool versions
        run: python scripts/tool_versions.py --strict

      - name: Run docs contract test
        run: python3 scripts/docs_contract_test.py

      - name: Configure
        run: cmake --preset docs -G Ninja

      - name: Generate documentation
        run: cmake --build --preset docs
